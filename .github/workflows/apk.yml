# Builds a debug APK for trying the Android app on a phone (sideload).
# Purchases are simulated (mock store): never submit this build to a store.
name: apk
on:
  workflow_dispatch:
  push:
    branches: [apk-build]
permissions:
  contents: read
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run cap:sync:mock
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk mugnut-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mugnut-debug-apk
          path: mugnut-debug.apk
